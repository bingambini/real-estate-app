<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Estate App v2.0</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcff; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        #splash-screen { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; justify-content: center; align-items: center; transition: 0.6s ease; }
        .hidden-splash { opacity: 0; visibility: hidden; }
        
        .details-page { position: fixed; inset: 0; background: white; z-index: 500; transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .details-page.active { transform: translateY(0); }

        .slider-container { position: relative; height: 45vh; width: 100%; overflow: hidden; background: #f8f9fa; }
        
        .slider-wrapper { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -ms-overflow-style: none; }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide { min-width: 100%; height: 100%; scroll-snap-align: start; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .slider-dots { position: absolute; bottom: 55px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 35; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); transition: all 0.3s ease; }
        .dot.active { background: white; width: 18px; border-radius: 10px; }
        
        .info-badge { position: absolute; top: 20px; right: 20px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); color: white; padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; z-index: 30; }
        
        .tab-btn { position: relative; padding-bottom: 8px; font-weight: 800; color: #cbd5e1; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { color: #2563eb; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 20px; height: 3px; background: #2563eb; border-radius: 10px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Glassmorphism Navigation */
        #bottom-nav {
            position: fixed; bottom: 25px; left: 20px; right: 20px; height: 70px;
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 25px; display: flex;
            justify-content: space-around; align-items: center; z-index: 400;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 0 10px;
        }

        .nav-item { display: flex; flex-direction: column; align-items: center; color: #94a3b8; cursor: pointer; width: 20%; }
        .nav-item.active { color: #2563eb; }
        .nav-label { font-size: 8px; font-weight: 800; margin-top: 4px; text-transform: uppercase; }
    </style>
</head>
<body class="pb-32">

    <div id="splash-screen">
        <img src="https://github.com/bingambini/real-estate-app/blob/main/splash.jpg?raw=true" class="w-full h-full object-cover">
    </div>

    <div id="main-content" style="opacity: 0;">
        <header class="pt-8 px-6 pb-2">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">უძრავი ქონება</p>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">იპოვე შენი სახლი</h1>
        </header>
        <div id="property-container" class="px-6 mt-6 grid grid-cols-1 gap-6"></div>
    </div>

    <div id="details-page" class="details-page no-scrollbar">
        <div class="slider-container">
            <div id="slider-wrapper" class="slider-wrapper"></div>
            <div id="slider-dots" class="slider-dots"></div>
            <div class="info-badge">ID: <span id="det-id">---</span></div>
            <button onclick="closeDetails()" class="absolute top-6 left-6 bg-white/95 w-10 h-10 rounded-full shadow-lg flex items-center justify-center z-20"><i class="fa-solid fa-arrow-left text-slate-800"></i></button>
        </div>
        <div class="px-7 pt-7 bg-white -mt-10 rounded-t-[40px] relative min-h-[65vh] z-20 shadow-2xl">
            <div class="mb-4">
                <h1 id="det-title" class="text-2xl font-black text-[#1e293b] leading-tight">...</h1>
                <p id="det-loc" class="text-slate-400 font-bold text-[11px] mt-1 uppercase tracking-widest"></p>
            </div>
            <div class="flex items-center justify-between mb-8">
                <span id="det-price" class="text-3xl font-black text-blue-600">0 ₾</span>
                <div class="flex gap-4">
                    <div class="flex flex-col items-center"><span id="det-rooms" class="font-black text-slate-800">0</span><span class="text-[9px] font-bold text-slate-400 uppercase">ოთახი</span></div>
                    <div class="flex flex-col items-center"><span id="det-floor" class="font-black text-slate-800">0</span><span class="text-[9px] font-bold text-slate-400 uppercase">სართ.</span></div>
                    <div class="flex flex-col items-center"><span id="det-sq" class="font-black text-slate-800">0</span><span class="text-[9px] font-bold text-slate-400 uppercase">კვ.მ</span></div>
                </div>
            </div>
            <div class="flex justify-between mb-6 border-b border-slate-50">
                <div onclick="switchTab('tab-desc', this)" class="tab-btn active">აღწერა</div>
                <div onclick="switchTab('tab-features', this)" class="tab-btn">დეტალები</div>
                <div onclick="switchTab('tab-contact', this)" class="tab-btn">კონტაქტი</div>
            </div>
            <div id="tab-desc" class="tab-content active text-slate-500 text-[15px] leading-relaxed pb-10"></div>
            <div id="tab-features" class="tab-content text-slate-500 pb-10"><div class="grid grid-cols-2 gap-4" id="features-list"></div></div>
            <div id="tab-contact" class="tab-content pb-10 text-center">
                <div class="bg-slate-50 p-6 rounded-[30px] border border-slate-100">
                    <i class="fa-solid fa-user-tie text-4xl text-slate-300 mb-3"></i>
                    <p id="det-phone" class="text-blue-600 font-bold mb-6">--- --- ---</p>
                    <a id="call-btn" href="#" class="block w-full bg-blue-600 text-white text-center py-4 rounded-2xl font-black shadow-lg shadow-blue-200 active:scale-95 transition-all"><i class="fa-solid fa-phone mr-2"></i> დარეკვა</a>
                </div>
            </div>
        </div>
    </div>

    <div id="profile-page" class="details-page no-scrollbar">
        <div class="p-8 text-center">
            <h2 id="m-name" class="text-2xl font-black mb-4">...</h2>
            <img id="m-photo" src="" class="w-32 h-32 mx-auto rounded-full mb-4 object-cover shadow-xl">
            <p id="m-id" class="text-slate-400 mb-8"></p>
            <button onclick="closeProfile()" class="bg-slate-900 text-white px-8 py-3 rounded-xl font-bold">დახურვა</button>
        </div>
    </div>

    <nav id="bottom-nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fa-solid fa-house-chimney text-xl"></i><span class="nav-label">მთავარი</span></div>
        <div class="nav-item"><i class="fa-solid fa-magnifying-glass text-xl"></i><span class="nav-label">ძებნა</span></div>
        <div class="nav-item"><i class="fa-solid fa-heart text-xl"></i><span class="nav-label">რჩეული</span></div>
        <div class="nav-item" onclick="openProfile()"><i class="fa-solid fa-circle-user text-xl"></i><span class="nav-label">პროფილი</span></div>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxta9JUYUMBHeB7w22xQGBF4F0wkeSdSbXeU0hMPnctd8YPl9u5fOnkS3Lx224OWpBf3A/exec";
        const tg = window.Telegram.WebApp;
        window.maklerInfo = null;

        async function init() {
            tg.expand();
            tg.ready();
            setTimeout(() => { 
                document.getElementById('splash-screen').classList.add('hidden-splash'); 
                document.getElementById('main-content').style.opacity = '1'; 
            }, 2000);
            await fetchData();
        }

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderProperties(data.listings);
                window.maklerInfo = data.makler;
            } catch (e) { console.error(e); }
        }

        function renderProperties(items) {
            const container = document.getElementById('property-container');
            container.innerHTML = items.map(item => {
                const firstImg = item.Photos ? item.Photos.split(',')[0].trim() : '';
                return `
                <div onclick='openDetails(${JSON.stringify(item)})' class="bg-white rounded-[32px] overflow-hidden shadow-sm border border-slate-100 mb-4">
                    <div class="relative h-60"><img src="${firstImg}" class="w-full h-full object-cover"></div>
                    <div class="p-5">
                        <h4 class="font-black text-slate-800">${item.Street || item.PropertyType}</h4>
                        <p class="text-blue-600 font-bold">${item.TotalPrice} ${item.Currency === 'USD' ? '$' : '₾'}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function openDetails(item) {
            document.getElementById('det-title').innerText = item.PropertyType;
            document.getElementById('det-price').innerText = item.TotalPrice + " ₾";
            document.getElementById('det-id').innerText = item.ID;
            document.getElementById('det-phone').innerText = item.Phone || "";
            document.getElementById('call-btn').href = "tel:" + item.Phone;
            
            const wrapper = document.getElementById('slider-wrapper');
            if (item.Photos) {
                wrapper.innerHTML = item.Photos.split(',').map(url => `<div class="slide"><img src="${url.trim()}"></div>`).join('');
            }
            document.getElementById('details-page').classList.add('active');
        }

        function openProfile() {
            if(window.maklerInfo) {
                document.getElementById('m-name').innerText = window.maklerInfo.Name;
                document.getElementById('m-photo').src = window.maklerInfo.Photo;
                document.getElementById('profile-page').classList.add('active');
            }
        }
        function closeProfile() { document.getElementById('profile-page').classList.remove('active'); }
        function closeDetails() { document.getElementById('details-page').classList.remove('active'); }
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        init();
    </script>
</body>
</html>

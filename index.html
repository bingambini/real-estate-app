<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store UI Fix</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 140px; }

        /* შავი ბანერის გარანტირებული სტილი */
        #bottom-nav {
            position: fixed; bottom: 20px; left: 15px; right: 15px;
            height: 80px; background: #000000; border-radius: 30px;
            display: grid; grid-template-columns: repeat(4, 1fr); /* 4 თანაბარი სვეტი */
            align-items: center; z-index: 9999;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; border: none; background: none;
        }

        .nav-icon { font-size: 20px; margin-bottom: 4px; color: #555; }
        .nav-text { font-size: 10px; font-weight: 700; color: #555; }

        /* აქტიური ფერი */
        .nav-item.active .nav-icon,
        .nav-item.active .nav-text { color: #ffffff !important; }

        /* პროდუქტების სტილი სქრინშოტის მიხედვით */
        .product-card { background: white; border-radius: 35px; padding: 15px; border: 1px solid #f1f5f9; }
        .price-text { color: #2563eb; font-weight: 900; }
    </style>
</head>
<body>

    <header class="p-8 pb-4 flex justify-between items-center">
        <h1 class="font-black text-2xl">ახალი კოლექცია</h1>
        <i class="fa-solid fa-bell text-slate-200 text-xl"></i>
    </header>

    <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>

    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyLXPvQ12ZjDavvaPU5sjuUUk2OwUHT2fgtgorDBCtSJV7l5TfdUCPdmzhTZVfTfOMKkQ/exec";

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                // პროდუქტების გამოტანა
                const grid = document.getElementById('product-grid');
                grid.innerHTML = data.products.map(p => `
                    <div class="product-card">
                        <img src="${p.images.split(',')[0]}" class="h-32 w-full object-contain mb-2">
                        <h4 class="font-bold text-[11px] truncate text-slate-800">${p.name}</h4>
                        <span class="price-text text-sm">${p.price}₾</span>
                    </div>
                `).join('');

                // ნავიგაციის გამოტანა
                const nav = document.getElementById('bottom-nav');
                nav.innerHTML = data.navigation.map(n => `
                    <div class="nav-item ${n.Status === 'active' ? 'active' : ''}" onclick="setActive(this)">
                        <i class="fa-solid ${n.Icon} nav-icon"></i>
                        <span class="nav-text">${n.Label}</span>
                    </div>
                `).join('');
                
            } catch (e) { console.error("Error loading data:", e); }
        }

        function setActive(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>

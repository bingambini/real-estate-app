<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Estate App v2.0</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* აღწერის ტაბის სქროლი */
        #tab-desc {
            max-height: 250px;
            overflow-y: auto;
            scrollbar-width: thin;
        }
        #tab-desc::-webkit-scrollbar {
            width: 4px;
        }
        #tab-desc::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
    </style>
</head>
<body class="pb-32 bg-slate-50">

    <div id="splash-screen">
        <img src="https://github.com/bingambini/real-estate-app/blob/main/splash.jpg?raw=true" class="w-full h-full object-cover">
    </div>

    <div id="main-content" style="opacity: 0; transition: opacity 0.5s ease-in;">
        <header class="pt-8 px-6 pb-2">
            <p class="text-[10px] text-blue-500 font-bold uppercase tracking-widest mb-1">უძრავი ქონება</p>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">იპოვე შენი სახლი</h1>
        </header>
        
        <div id="property-container" class="px-6 mt-6 grid grid-cols-1 gap-6"></div>
    </div>

    <div id="details-page" class="details-page no-scrollbar">
        <div class="slider-container">
            <div id="slider-wrapper" class="slider-wrapper"></div>
            <div id="slider-dots" class="slider-dots"></div>
            <div class="info-badge">ID: <span id="det-id">---</span></div>
            <button onclick="closeDetails()" class="absolute top-6 left-6 bg-white/95 w-10 h-10 rounded-full shadow-lg flex items-center justify-center z-20 active:scale-90 transition-all">
                <i class="fa-solid fa-arrow-left text-slate-800"></i>
            </button>
        </div>

        <div class="px-7 pt-7 bg-white -mt-10 rounded-t-[40px] relative min-h-[65vh] z-20 shadow-2xl">
            <div class="mb-4">
                <h1 id="det-title" class="text-xl font-black text-[#1e293b] leading-tight">...</h1>
                <p id="det-loc" class="text-slate-400 font-bold text-[11px] mt-1 uppercase tracking-widest"></p>
            </div>

            <div class="flex items-center justify-between mb-8">
                <span id="det-price" class="text-2xl font-black text-blue-600">0 ₾</span>
            </div>

            <div class="flex justify-between mb-6 border-b border-slate-50">
                <div onclick="switchTab('tab-desc', this)" class="tab-btn active">აღწერა</div>
                <div onclick="switchTab('tab-features', this)" class="tab-btn">დეტალები</div>
                <div onclick="switchTab('tab-contact', this)" class="tab-btn">კონტაქტი</div>
            </div>

            <div id="tab-desc" class="tab-content active text-slate-500 text-[15px] leading-relaxed pb-10"></div>
            
            <div id="tab-features" class="tab-content text-slate-500 pb-10">
                <div class="grid grid-cols-2 gap-4" id="features-list"></div>
            </div>
            
            <div id="tab-contact" class="tab-content pb-10 -mt-4">
                </div>
        </div>
    </div>

    <div id="profile-page" class="details-page no-scrollbar bg-slate-50">
        <div class="px-6 py-6 flex items-center justify-between bg-white shadow-sm sticky top-0 z-50">
            <button onclick="closeProfile()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center text-slate-800 active:scale-90 transition-all">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h3 class="font-black text-slate-800 uppercase tracking-widest text-xs">მაკლერის პროფილი</h3>
            <div class="w-10"></div>
        </div>

        <div class="p-6">
            <div class="bg-white rounded-[40px] p-8 shadow-xl shadow-slate-200/50 relative overflow-hidden mb-8">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-50 rounded-full blur-3xl"></div>
                
                <div class="relative z-10 flex flex-col items-center">
                    <div class="relative mb-6">
                        <img id="m-photo" src="" class="w-32 h-32 rounded-[35px] object-cover shadow-2xl border-4 border-white">
                        <div class="absolute -bottom-2 -right-2 bg-green-500 w-6 h-6 rounded-full border-4 border-white"></div>
                    </div>
                    
                    <h2 id="m-name" class="text-2xl font-black text-slate-800 mb-1 text-center">...</h2>
                    <p class="text-blue-600 font-bold text-[10px] uppercase tracking-widest mb-6">პროფესიონალი მაკლერი</p>
                    
                    <div class="flex gap-3 w-full">
                        <a id="m-call" href="#" class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black text-sm shadow-lg shadow-blue-200 flex items-center justify-center gap-2 active:scale-95 transition-all">
                            <i class="fa-solid fa-phone"></i> დარეკვა
                        </a>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-white p-6 rounded-[30px] border border-slate-100">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">იდენტიფიკატორი</p>
                    <p id="m-id" class="text-slate-800 font-black text-lg">---</p>
                </div>
                <div class="bg-white p-6 rounded-[30px] border border-slate-100">
                    <p class="text-[9px] font-black text-slate-400 uppercase mb-1">სტატუსი</p>
                    <p class="text-green-600 font-black text-lg flex items-center gap-1.5">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span> Active
                    </p>
                </div>
            </div>
        </div>
    </div>

    <nav id="bottom-nav">
        <div class="nav-item active" onclick="location.reload()">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="nav-label">მთავარი</span>
        </div>
        <div class="nav-item" onclick="openProfile()">
            <i class="fa-solid fa-user text-xl"></i>
            <span class="nav-label">პროფილი</span>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>

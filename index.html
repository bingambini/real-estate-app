<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store v2.1</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 130px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* შავი ნავიგაცია ტექსტებით */
        #bottom-nav {
            position: fixed; bottom: 25px; left: 20px; right: 20px;
            height: 75px; background: #000; border-radius: 35px;
            display: flex; justify-content: space-around; align-items: center;
            z-index: 1000; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            padding: 0 10px;
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: #64748b; transition: 0.3s;
            cursor: pointer; min-width: 60px;
        }

        .nav-item.active { color: white; }

        .nav-label {
            font-size: 9px; font-weight: 800; margin-top: 4px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* პროდუქტის ბარათი */
        .product-card {
            background: white; border-radius: 30px; padding: 15px;
            position: relative; transition: 0.2s;
        }
        .product-card:active { transform: scale(0.96); }

        .discount-badge {
            position: absolute; top: 12px; right: 12px;
            background: #ff5f5f; color: white; padding: 3px 8px;
            border-radius: 10px; font-size: 10px; font-weight: 800;
        }

        .details-page { 
            position: fixed; inset: 0; background: white; z-index: 2000; 
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            overflow-y: auto; 
        }
        .details-page.active { transform: translateY(0); }
    </style>
</head>
<body>

    <header class="p-6 pt-8 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-white shadow-sm rounded-xl flex items-center justify-center">
                <img src="https://github.com/bingambini/real-estate-app/blob/main/shoes_logo.png?raw=true" class="w-7 h-7 object-contain">
            </div>
            <h1 class="font-extrabold text-lg text-slate-800">Shoes Store</h1>
        </div>
        <button class="w-10 h-10 bg-white shadow-sm rounded-xl flex items-center justify-center text-slate-300">
            <i class="fa-solid fa-bell"></i>
        </button>
    </header>

    <div id="main-content">
        <div class="px-7 mb-4 flex justify-between items-center">
            <span class="text-[11px] uppercase tracking-[2px] font-black text-slate-400">ახალი კოლექცია</span>
            <span class="text-blue-600 font-bold text-xs">ყველა</span>
        </div>

        <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>
    </div>

    <nav id="bottom-nav"></nav>

    <div id="details-page" class="details-page no-scrollbar">
        <button onclick="closeDetails()" class="absolute top-6 left-6 bg-white w-10 h-10 rounded-full shadow-lg flex items-center justify-center z-[2001]"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="h-[45vh] bg-slate-50 flex items-center justify-center p-12">
            <img id="det-img" class="max-h-full object-contain drop-shadow-2xl">
        </div>
        <div class="p-8 bg-white -mt-8 rounded-t-[40px] relative z-10 shadow-2xl">
            <h1 id="det-title" class="text-2xl font-black mb-1 text-slate-800"></h1>
            <p id="det-cat" class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mb-4"></p>
            <div id="det-price" class="text-3xl font-black text-blue-600 mb-6"></div>
            <div id="det-desc" class="text-slate-500 leading-relaxed text-sm"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyLXPvQ12ZjDavvaPU5sjuUUk2OwUHT2fgtgorDBCtSJV7l5TfdUCPdmzhTZVfTfOMKkQ/exec";
        const tg = window.Telegram.WebApp;

        async function init() {
            tg.expand();
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                if (data.products) renderProducts(data.products);
                if (data.navigation) renderNavigation(data.navigation);
            } catch (e) { console.error("Load failed", e); }
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => {
                const discount = p.oldPrice ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : null;
                return `
                    <div class="product-card border border-slate-50" onclick='openDetails(${JSON.stringify(p)})'>
                        ${discount ? `<div class="discount-badge">-${discount}%</div>` : ''}
                        <div class="h-32 flex items-center justify-center mb-4">
                            <img src="${p.images.split(',')[0]}" class="max-h-full object-contain drop-shadow-xl">
                        </div>
                        <h4 class="font-bold text-xs truncate text-slate-800">${p.name}</h4>
                        <div class="flex items-center justify-between mt-2">
                            <span class="font-black text-blue-600 text-sm">${p.price}₾</span>
                            ${p.oldPrice ? `<span class="text-[9px] text-slate-300 line-through font-bold">${p.oldPrice}₾</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderNavigation(nav) {
            const container = document.getElementById('bottom-nav');
            container.innerHTML = nav.map(n => `
                <div class="nav-item ${n.Status === 'active' ? 'active' : ''}" onclick="handleNav(this)">
                    <i class="fa-solid ${n.Icon} text-lg"></i>
                    <span class="nav-label">${n.Label}</span>
                </div>
            `).join('');
        }

        function handleNav(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        function openDetails(p) {
            document.getElementById('det-img').src = p.images.split(',')[0];
            document.getElementById('det-title').innerText = p.name;
            document.getElementById('det-price').innerText = p.price + "₾";
            document.getElementById('det-desc').innerText = p.desc || "აღწერა არ არის.";
            document.getElementById('det-cat').innerText = p.category;
            document.getElementById('details-page').classList.add('active');
        }

        function closeDetails() {
            document.getElementById('details-page').classList.remove('active');
        }

        init();
    </script>
</body>
</html>

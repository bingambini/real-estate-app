<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Estate App v2.0</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcff; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        #splash-screen { position: fixed; inset: 0; z-index: 1000; background: #fff; display: flex; justify-content: center; align-items: center; transition: 0.6s ease; }
        .hidden-splash { opacity: 0; visibility: hidden; }
        
        .details-page { position: fixed; inset: 0; background: white; z-index: 500; transform: translateY(100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; }
        .details-page.active { transform: translateY(0); }

        .slider-container { position: relative; height: 45vh; width: 100%; overflow: hidden; background: #f8f9fa; }
        
        .slider-wrapper { 
            display: flex; 
            height: 100%; 
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        .slider-wrapper::-webkit-scrollbar { display: none; }
        
        .slide { min-width: 100%; height: 100%; scroll-snap-align: start; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        
        .slider-dots {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 35;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }
        .dot.active {
            background: white;
            width: 18px;
            border-radius: 10px;
        }
        
        .info-badge { position: absolute; top: 20px; right: 20px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); color: white; padding: 6px 14px; border-radius: 12px; font-size: 11px; font-weight: 800; z-index: 30; }
        
        .tab-btn { position: relative; padding-bottom: 8px; font-weight: 800; color: #cbd5e1; cursor: pointer; font-size: 13px; white-space: nowrap; transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { color: #2563eb; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 0; width: 20px; height: 3px; background: #2563eb; border-radius: 10px; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* განახლებული ნავიგაცია სარკის ეფექტით */
        #bottom-nav {
            position: fixed; bottom: 25px; left: 20px; right: 20px; height: 75px;
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; display: flex;
            justify-content: space-around; align-items: center; z-index: 400;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); padding: 0 10px;
        }

        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            color: #94a3b8; cursor: pointer; transition: all 0.3s ease;
            width: 20%;
        }
        .nav-item.active { color: #2563eb; }
        .nav-item i { font-size: 20px; transition: transform 0.2s ease; }
        .nav-item.active i { transform: translateY(-2px); }
        .nav-label { font-size: 8px; font-weight: 800; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body class="pb-32">

    <div id="splash-screen">
        <img src="https://github.com/bingambini/real-estate-app/blob/main/splash.jpg?raw=true" class="w-full h-full object-cover">
    </div>

    <div id="main-content" style="opacity: 0;">
        <header class="pt-8 px-6 pb-2">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest mb-1">უძრავი ქონება</p>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">იპოვე შენი სახლი</h1>
        </header>

        <div id="property-container" class="px-6 mt-6 grid grid-cols-1 gap-6"></div>
    </div>

    <div id="details-page" class="details-page no-scrollbar">
        <div class="slider-container">
            <div id="slider-wrapper" class="slider-wrapper"></div>
            <div id="slider-dots" class="slider-dots"></div>
            <div class="info-badge">ID: <span id="det-id">---</span></div>
            <button onclick="closeDetails()" class="absolute top-6 left-6 bg-white/95 w-10 h-10 rounded-full shadow-lg flex items-center justify-center z-20"><i class="fa-solid fa-arrow-left text-slate-800"></i></button>
        </div>

        <div class="px-7 pt-7 bg-white -mt-10 rounded-t-[40px] relative min-h-[65vh] z-20 shadow-2xl">
            <div class="mb-4">
                <h1 id="det-title" class="text-2xl font-black text-[#1e293b] leading-tight">...</h1>
                <p id="det-loc" class="text-slate-400 font-bold text-[11px] mt-1 uppercase tracking-widest"></p>
            </div>

            <div class="flex items-center justify-between mb-8">
                <span id="det-price" class="text-3xl font-black text-blue-600">0 ₾</span>
                <div class="flex gap-4">
                    <div class="flex flex-col items-center"><span id="det-rooms" class="font-black text-slate-800">0</span><span class="text-[9px] font-bold text-slate-400 uppercase">ოთახი</span></div>
                    <div class="flex flex-col items-center"><span id="det-floor" class="font-black text-slate-800">0</span><span class="text-[9px] font-bold text-slate-400 uppercase">სართ.</span></div>
                    <div class="flex flex-col items-center"><span id="det-sq" class="font-black text-slate-800">0</span><span class="text-[9px] font-bold text-slate-400 uppercase">კვ.მ</span></div>
                </div>
            </div>

            <div class="flex justify-between mb-6 border-b border-slate-50">
                <div onclick="switchTab('tab-desc', this)" class="tab-btn active">აღწერა</div>
                <div onclick="switchTab('tab-features', this)" class="tab-btn">დეტალები</div>
                <div onclick="switchTab('tab-contact', this)" class="tab-btn">კონტაქტი</div>
            </div>

            <div id="tab-desc" class="tab-content active text-slate-500 text-[15px] leading-relaxed pb-10"></div>
            
            <div id="tab-features" class="tab-content text-slate-500 pb-10">
                <div class="grid grid-cols-2 gap-4" id="features-list"></div>
            </div>

            <div id="tab-contact" class="tab-content pb-10 text-center">
                <div id="agent-box" class="bg-slate-50 p-6 rounded-[30px] border border-slate-100">
                    <i class="fa-solid fa-user-tie text-4xl text-slate-300 mb-3"></i>
                    <p class="font-black text-slate-800 text-lg mb-1">მეპატრონე / აგენტი</p>
                    <p id="det-phone" class="text-blue-600 font-bold mb-6">--- --- ---</p>
                    <a id="call-btn" href="#" class="block w-full bg-blue-600 text-white text-center py-4 rounded-2xl font-black shadow-lg shadow-blue-200 active:scale-95 transition-all">
                        <i class="fa-solid fa-phone mr-2"></i> დარეკვა
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="profile-page" class="details-page no-scrollbar">
        <div class="p-8">
            <div class="flex items-start gap-5 mb-8">
                <div class="relative w-24 h-24 shrink-0">
                    <img id="m-photo" src="https://via.placeholder.com/150" class="w-full h-full object-cover rounded-[25px] shadow-xl border-2 border-white">
                    <div class="absolute -bottom-1 -right-1 bg-green-500 w-6 h-6 rounded-full border-4 border-white"></div>
                </div>
                
                <div class="flex flex-col pt-2">
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">პროფესიონალი მაკლერი</p>
                    <h2 id="m-name" class="text-xl font-black text-slate-800 leading-tight mb-1">...</h2>
                    <div class="inline-flex items-center bg-slate-100 px-3 py-1 rounded-full w-fit">
                        <span class="text-[9px] font-bold text-slate-500 uppercase mr-1">ID:</span>
                        <span id="m-id" class="text-[10px] font-black text-slate-700">---</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <div class="bg-slate-50 p-5 rounded-[30px] border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">ვოტერმარკი</p>
                    <p id="m-wm" class="text-slate-700 font-bold text-xs italic truncate">---</p>
                </div>
                <div class="bg-slate-50 p-5 rounded-[30px] border border-slate-100">
                    <p class="text-[10px] font-black text-slate-400 uppercase mb-1">სტატუსი</p>
                    <p class="text-green-600 font-bold text-xs uppercase flex items-center gap-1">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full"></span> აქტიური
                    </p>
                </div>
            </div>

            <div class="space-y-3">
                <a id="m-call" href="#" class="flex items-center justify-between bg-white border border-slate-100 p-5 rounded-2xl shadow-sm active:scale-95 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600"><i class="fa-solid fa-phone"></i></div>
                        <span class="font-bold text-slate-700">დარეკვა</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-300"></i>
                </a>
                
                <div class="flex items-center justify-between bg-white border border-slate-100 p-5 rounded-2xl shadow-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center text-indigo-600"><i class="fa-solid fa-share-nodes"></i></div>
                        <span class="font-bold text-slate-700">პროფილის გაზიარება</span>
                    </div>
                    <i class="fa-solid fa-lock text-[10px] text-slate-300"></i>
                </div>
            </div>

            <div class="mt-12 text-center">
                <button onclick="closeProfile()" class="text-slate-400 font-bold text-sm uppercase tracking-widest underline decoration-2 underline-offset-8">დახურვა</button>
            </div>
        </div>
    </div>

    <nav id="bottom-nav">
        <div class="nav-item active"><i class="fa-solid fa-house-chimney"></i><span class="nav-label">მთავარი</span></div>
        <div class="nav-item"><i class="fa-solid fa-magnifying-glass-location"></i><span class="nav-label">ძებნა</span></div>
        <div class="nav-item"><i class="fa-solid fa-heart"></i><span class="nav-label">რჩეული</span></div>
        <div class="nav-item" onclick="openProfile()"><i class="fa-solid fa-user-gear"></i><span class="nav-label">პროფილი</span></div>
    </nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxta9JUYUMBHeB7w22xQGBF4F0wkeSdSbXeU0hMPnctd8YPl9u5fOnkS3Lx224OWpBf3A/exec";
        const tg = window.Telegram.WebApp;
        window.maklerInfo = null;

        async function init() {
            tg.expand();
            tg.ready();
            
            setTimeout(() => { 
                document.getElementById('splash-screen').classList.add('hidden-splash'); 
                document.getElementById('main-content').style.opacity = '1'; 
            }, 2000);

            await fetchData();
        }

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderProperties(data.listings);
                window.maklerInfo = data.makler;
            } catch (e) { 
                console.error("Error fetching data:", e);
                document.getElementById('property-container').innerHTML = "<p class='text-center text-red-500'>მონაცემების ჩატვირთვა ვერ მოხერხდა</p>";
            }
        }

        function renderProperties(items) {
            const container = document.getElementById('property-container');
            container.innerHTML = items.map(item => {
                const firstImg = item.Photos ? item.Photos.split(',')[0].trim() : 'https://via.placeholder.com/400x300?text=No+Image';
                return `
                <div onclick='openDetails(${JSON.stringify(item)})' class="group bg-white rounded-[32px] overflow-hidden shadow-sm border border-slate-100 active:scale-[0.97] transition-all duration-300 mb-2">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${firstImg}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur-md px-4 py-1.5 rounded-2xl text-[10px] font-black uppercase text-slate-800 shadow-sm">
                            ${item.DealType || 'იყიდება'}
                        </div>
                        <div class="absolute bottom-4 left-4 bg-blue-600 px-4 py-2 rounded-2xl shadow-lg">
                            <p class="text-white font-black text-lg leading-none">${item.TotalPrice} ${item.Currency === 'USD' ? '$' : '₾'}</p>
                        </div>
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="font-black text-slate-800 text-lg leading-tight truncate w-2/3">${item.Street || item.PropertyType}</h4>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-50 px-2 py-1 rounded-lg uppercase tracking-tighter">ID: ${item.ID}</span>
                        </div>
                        <p class="text-slate-400 text-xs font-medium mb-4 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-blue-500"></i> ${item.District}, ${item.City}
                        </p>
                        <div class="flex items-center gap-4 border-t border-slate-50 pt-4">
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-bed text-slate-300 text-xs"></i>
                                <span class="text-xs font-bold text-slate-600">${item.Rooms}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-vector-square text-slate-300 text-xs"></i>
                                <span class="text-xs font-bold text-slate-600">${item.TotalArea} მ²</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                <i class="fa-solid fa-stairs text-slate-300 text-xs"></i>
                                <span class="text-xs font-bold text-slate-600">${item.Floor} სართ.</span>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function openDetails(item) {
            if (item.ID) {
                fetch(`${API_URL}?viewId=${item.ID}`).catch(err => console.error("Counter error:", err));
            }

            document.getElementById('det-title').innerText = `${item.Rooms} ოთახიანი ${item.PropertyType}`;
            document.getElementById('det-loc').innerText = `${item.City}, ${item.District}, ${item.Street || ''}`;
            document.getElementById('det-price').innerText = `${item.TotalPrice} ${item.Currency === 'USD' ? '$' : '₾'}`;
            document.getElementById('det-id').innerText = item.ID;
            document.getElementById('det-rooms').innerText = item.Rooms || "0";
            document.getElementById('det-floor').innerText = `${item.Floor}/${item.TotalFloors || '?'}`;
            document.getElementById('det-sq').innerText = item.TotalArea || "0";
            document.getElementById('tab-desc').innerText = item.Description || "აღწერა არ არის მითითებული";

            const features = [
                { label: "მდგომარეობა", val: item.Condition },
                { label: "პროექტი", val: item.ProjectType },
                { label: "გათბობა", val: item.Heating },
                { label: "ჭერი", val: item.CeilingHeight },
                { label: "პარკინგი", val: item.Parking }
            ];
            document.getElementById('features-list').innerHTML = features.filter(f => f.val).map(f => `
                <div class="bg-slate-50 p-3 rounded-2xl">
                    <p class="text-[9px] uppercase font-bold text-slate-400">${f.label}</p>
                    <p class="text-xs font-black text-slate-700">${f.val}</p>
                </div>
            `).join('');

            document.getElementById('det-phone').innerText = item.Phone || "არ არის მითითებული";
            document.getElementById('call-btn').href = `tel:${item.Phone}`;

            const wrapper = document.getElementById('slider-wrapper');
            const dotsContainer = document.getElementById('slider-dots');
            
            if (item.Photos) {
                const photoList = item.Photos.split(',');
                wrapper.innerHTML = photoList.map(url => `
                    <div class="slide"><img src="${url.trim()}" onerror="this.src='https://via.placeholder.com/400x300?text=Error'"></div>
                `).join('');

                dotsContainer.innerHTML = photoList.map((_, index) => `
                    <div class="dot ${index === 0 ? 'active' : ''}"></div>
                `).join('');

                wrapper.onscroll = () => {
                    const scrollIndex = Math.round(wrapper.scrollLeft / wrapper.clientWidth);
                    document.querySelectorAll('.dot').forEach((dot, i) => {
                        dot.classList.toggle('active', i === scrollIndex);
                    });
                };
                wrapper.scrollLeft = 0;
            }
            
            document.getElementById('details-page').classList.add('active');
        }

        function openProfile() {
            const m = window.maklerInfo;
            if (!m) return;
            document.getElementById('m-name').innerText = m.Name || "მაკლერი";
            document.getElementById('m-photo').src = m.Photo || "https://via.placeholder.com/150";
            document.getElementById('m-wm').innerText = m.WatermarkText || "---";
            document.getElementById('m-id').innerText = m.ID || "---";
            document.getElementById('m-call').href = `tel:${m.Phone}`;
            document.getElementById('profile-page').classList.add('active');
        }

        function closeProfile() { document.getElementById('profile-page').classList.remove('active'); }
        function closeDetails() { document.getElementById('details-page').classList.remove('active'); }
        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>

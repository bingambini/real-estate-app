<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store Fixed</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 140px; }

        /* შავი ბანერი წარწერებით */
        #bottom-nav {
            position: fixed; 
            bottom: 20px; 
            left: 15px; 
            right: 15px;
            height: 85px; 
            background: #000000; 
            border-radius: 35px;
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            z-index: 9999;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            padding: 0 10px;
        }

        .nav-item {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            flex: 1;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        /* არააქტიური ღილაკის ფერი */
        .nav-item .nav-icon, .nav-item .nav-text {
            color: #64748b; 
        }

        /* აქტიური ღილაკის ფერი (თეთრი) */
        .nav-item.active .nav-icon, .nav-item.active .nav-text {
            color: #ffffff !important;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .nav-text {
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* პროდუქტების სტილი */
        .product-card { background: white; border-radius: 30px; padding: 15px; border: 1px solid #f1f5f9; }
    </style>
</head>
<body>

    <header class="p-8 pb-4">
        <h1 class="font-black text-2xl text-slate-800">ახალი კოლექცია</h1>
    </header>

    <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>

    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyLXPvQ12ZjDavvaPU5sjuUUk2OwUHT2fgtgorDBCtSJV7l5TfdUCPdmzhTZVfTfOMKkQ/exec";

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderProducts(data.products);
                renderNavigation(data.navigation);
            } catch (e) { console.error(e); }
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => `
                <div class="product-card">
                    <img src="${p.images.split(',')[0]}" class="h-32 w-full object-contain mb-2">
                    <h4 class="font-bold text-xs truncate">${p.name}</h4>
                    <span class="text-blue-600 font-black">${p.price}₾</span>
                </div>
            `).join('');
        }

        function renderNavigation(navData) {
            const navContainer = document.getElementById('bottom-nav');
            // ყურადღება: ვიყენებთ n.Label და n.Icon (დიდი ასოებით)
            navContainer.innerHTML = navData.map(n => `
                <div class="nav-item ${n.Status === 'active' ? 'active' : ''}" onclick="setActive(this)">
                    <i class="fa-solid ${n.Icon} nav-icon"></i>
                    <span class="nav-text">${n.Label}</span>
                </div>
            `).join('');
        }

        function setActive(el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>

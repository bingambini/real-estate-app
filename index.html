<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shoes Store Final UI</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fc; margin: 0; padding-bottom: 150px; }

        /* განახლებული შავი ბანერი - უფრო მაღალი და მკაფიო */
        #bottom-nav {
            position: fixed; 
            bottom: 25px; 
            left: 15px; 
            right: 15px;
            height: 90px; /* სიმაღლე გავზარდეთ ტექსტისთვის */
            background: #000000; 
            border-radius: 35px;
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            z-index: 9999;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 0 5px;
        }

        .nav-item {
            display: flex !important;
            flex-direction: column !important; /* აუცილებელია იკონკა ზემოთ, ტექსტი ქვემოთ */
            align-items: center !important;
            justify-content: center !important;
            flex: 1;
            height: 100%;
            transition: 0.3s;
        }

        /* იკონკის სტილი */
        .nav-icon {
            font-size: 20px;
            margin-bottom: 6px;
            color: #4b5563; /* ნაცრისფერი (არააქტიური) */
        }

        /* ტექსტის სტილი - აქ იყო პრობლემა */
        .nav-text {
            font-size: 10px !important;
            font-weight: 700;
            color: #4b5563; /* ნაცრისფერი (არააქტიური) */
            text-transform: none;
            display: block !important;
        }

        /* აქტიური ელემენტის ფერი (თეთრი) */
        .nav-item.active .nav-icon,
        .nav-item.active .nav-text {
            color: #ffffff !important;
        }

        /* პროდუქტის ბარათი */
        .product-card { background: white; border-radius: 30px; padding: 15px; border: 1px solid #f1f5f9; position: relative; }
        .discount-badge { position: absolute; top: 10px; right: 10px; background: #ff5f5f; color: white; padding: 4px 8px; border-radius: 10px; font-size: 10px; font-weight: 800; }
    </style>
</head>
<body>

    <header class="p-8 pb-4 flex justify-between items-center">
        <h1 class="font-black text-2xl text-slate-800">ახალი კოლექცია</h1>
        <i class="fa-solid fa-bell text-slate-300 text-xl"></i>
    </header>

    <div id="product-grid" class="grid grid-cols-2 gap-4 px-6"></div>

    <nav id="bottom-nav"></nav>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyLXPvQ12ZjDavvaPU5sjuUUk2OwUHT2fgtgorDBCtSJV7l5TfdUCPdmzhTZVfTfOMKkQ/exec";

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderProducts(data.products);
                renderNavigation(data.navigation);
            } catch (e) { console.error(e); }
        }

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => {
                const discount = p.oldPrice ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100) : null;
                return `
                <div class="product-card">
                    ${discount ? `<div class="discount-badge">-${discount}%</div>` : ''}
                    <img src="${p.images.split(',')[0]}" class="h-32 w-full object-contain mb-2">
                    <h4 class="font-bold text-[11px] truncate text-slate-700">${p.name}</h4>
                    <span class="text-blue-600 font-black text-sm">${p.price}₾</span>
                </div>
            `}).join('');
        }

        function renderNavigation(navData) {
            const container = document.getElementById('bottom-nav');
            // ვიყენებთ ზუსტად იმ სახელებს რაც JSON-შია: Label და Icon
            container.innerHTML = navData.map(n => `
                <div class="nav-item ${n.Status === 'active' ? 'active' : ''}" onclick="setActive(this)">
                    <i class="fa-solid ${n.Icon} nav-icon"></i>
                    <span class="nav-text">${n.Label}</span>
                </div>
            `).join('');
        }

        function setActive(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Estate App v2.0</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        #tab-desc {
            max-height: 300px;
            overflow-y: auto;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        #tab-desc::-webkit-scrollbar {
            width: 4px;
        }
        #tab-desc::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        #splash-screen {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            inset: 0;
            z-index: 9999;
        }
        /* ტაბების მართვისთვის */
        .tab-content-main { display: none; }
        .tab-content-main.active { display: block; }
        
        /* პროფილის ტაბის სპეციფიკური სტილი, როცა ის ტაბად მუშაობს */
        #profile-tab-content {
            min-height: 100vh;
            padding-bottom: 100px;
        }
    </style>
</head>
<body class="pb-32 bg-slate-50 font-sans">

    <div id="splash-screen">
        <img src="https://github.com/bingambini/real-estate-app/blob/main/splash.jpg?raw=true" class="w-full h-full object-cover">
    </div>

    <div id="main-content" style="opacity: 0; transition: opacity 0.5s ease-in;">
        
        <div id="home-tab" class="tab-content-main active">
            <header class="pt-8 px-6 pb-2">
                <p class="text-[10px] text-blue-500 font-bold uppercase tracking-widest mb-1">უძრავი ქონება</p>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">იპოვე შენი სახლი</h1>
            </header>
            <div id="property-container" class="px-6 mt-6 grid grid-cols-1 gap-6"></div>
        </div>

        <div id="profile-tab-content" class="tab-content-main bg-slate-50">
            <div class="px-6 py-6 flex items-center justify-between bg-white shadow-sm sticky top-0 z-50">
                <div class="w-10"></div>
                <h3 id="profile-header-title" class="font-black text-slate-800 uppercase tracking-widest text-xs">პროფილი</h3>
                <div class="w-10"></div>
            </div>

            <div class="p-6">
                <div id="user-profile-card" class="bg-white rounded-[30px] p-5 shadow-sm border-2 border-slate-100 mb-10 transition-all duration-500 relative">
                    <div class="flex items-center gap-5">
                        <div class="relative flex-shrink-0">
                            <img id="m-photo" src="" class="w-24 h-24 rounded-[22px] object-cover border-2 border-white shadow-sm">
                            <div id="user-tier-badge" class="absolute -top-2 -right-2 px-2 py-1 rounded-lg text-[8px] font-black shadow-lg border-2 border-white hidden uppercase tracking-tighter z-10">FREE</div>
                            <div class="absolute -bottom-1 -left-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white shadow-sm"></div>
                        </div>

                        <div class="flex flex-col justify-center h-24 py-0.5 overflow-hidden flex-1">
                            <h2 id="m-name" class="text-base font-black text-slate-800 leading-tight truncate mb-1">...</h2>
                            <div id="m-id-container"></div> 
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[8px] font-black text-slate-400 uppercase tracking-tighter">სტატუსი:</span>
                                <span id="user-role-badge" class="px-2 py-0.5 rounded-md bg-slate-50 text-slate-500 text-[9px] font-black uppercase border border-slate-100">---</span>
                            </div>
                        </div>
                    </div>
                    <div class="absolute -bottom-4 -right-2 flex items-center gap-2 z-20"></div>
                </div>

                <div id="premium-upgrade-card" class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-[30px] p-6 shadow-xl mb-10 relative overflow-hidden hidden">
                    <div class="relative z-10">
                        <h3 class="text-white font-black text-lg mb-1">გახდი PREMIUM</h3>
                        <p class="text-blue-100 text-[10px] mb-4 leading-relaxed opacity-80 uppercase tracking-wider">AI ანალიზი • PDF გენერაცია • VIP შეტყობინებები</p>
                        <button onclick="upgradeToPremium()" id="premium-button" class="bg-white text-blue-600 px-6 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">
                            ⭐ გააქტიურება (500 STARS)
                        </button>
                    </div>
                    <i class="fa-solid fa-crown absolute -right-4 -bottom-4 text-white/10 text-8xl rotate-12"></i>
                </div>

                <div id="profile-history-block"></div>
            </div>
        </div>

    </div>

    <div id="details-page" class="details-page no-scrollbar">
        <div class="slider-container">
            <div id="slider-wrapper" class="slider-wrapper"></div>
            <div id="slider-dots" class="slider-dots"></div>
            <div class="info-badge">ID: <span id="det-id">---</span></div>
            <button onclick="closeDetails()" class="absolute top-6 left-6 bg-white/95 w-10 h-10 rounded-full shadow-lg flex items-center justify-center z-20 active:scale-90 transition-all">
                <i class="fa-solid fa-arrow-left text-slate-800"></i>
            </button>
        </div>

        <div class="px-7 pt-7 bg-white -mt-10 rounded-t-[40px] relative min-h-[65vh] z-20 shadow-2xl">
            <div class="mb-4">
                <h1 id="det-title" class="text-xl font-black text-[#1e293b] leading-tight">...</h1>
                <p id="det-loc" class="text-slate-400 font-bold text-[11px] mt-1 uppercase tracking-widest"></p>
            </div>

            <div class="flex items-center justify-between mb-8">
                <span id="det-price" class="text-2xl font-black text-blue-600">0 ₾</span>
            </div>

            <div class="flex justify-between mb-6 border-b border-slate-50">
                <div onclick="switchDetailsTab('tab-desc', this)" class="tab-btn active">აღწერა</div>
                <div onclick="switchDetailsTab('tab-features', this)" class="tab-btn">დეტალები</div>
                <div onclick="switchDetailsTab('tab-contact', this)" class="tab-btn">კონტაქტი</div>
            </div>

            <div id="tab-desc" class="tab-content active text-slate-500 text-[15px] leading-relaxed pb-10"></div>
            
            <div id="tab-features" class="tab-content hidden text-slate-500 pb-10">
                <div class="grid grid-cols-2 gap-4" id="features-list"></div>
            </div>
            
            <div id="tab-contact" class="tab-content hidden pb-10 -mt-4"></div>
        </div>
    </div>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg border-t border-slate-100 px-8 py-4 flex justify-between items-center z-[100]">
        <div class="nav-item active flex flex-col items-center gap-1 active:scale-90 transition-all cursor-pointer" onclick="switchTab('home-tab', this)">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[10px] font-black uppercase tracking-tighter">მთავარი</span>
        </div>
        <div class="nav-item flex flex-col items-center gap-1 active:scale-90 transition-all opacity-50 cursor-pointer" onclick="switchTab('profile-tab-content', this); openProfile();">
            <i class="fa-solid fa-user text-xl"></i>
            <span class="text-[10px] font-black uppercase tracking-tighter">პროფილი</span>
        </div>
    </nav>

    <script>
        // Google Script API URL
        const API_URL = "https://script.google.com/macros/s/AKfycbyY_V5WCg8M2BO6790GlBolhDiXwPDVSsG499l-Wk8BDj6SDp68XlVoQDChFFuEt3gCWg/exec";

        function switchDetailsTab(tabId, el) {
            const parent = el.parentElement;
            parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            
            const container = el.closest('#details-page');
            container.querySelectorAll('.tab-content').forEach(t => {
                t.style.display = 'none';
                t.classList.remove('active');
            });
            const target = document.getElementById(tabId);
            if(target) {
                target.style.display = 'block';
                target.classList.add('active');
            }
        }

        // Premium გადახდის ფუნქცია
        async function upgradeToPremium() {
            const tg = window.Telegram.WebApp;
            const userId = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;

            if (!userId) {
                alert("გთხოვთ, გახსნათ ბოტიდან");
                return;
            }

            const btn = document.getElementById('premium-button');
            const originalText = btn.innerText;
            btn.innerText = "მუშავდება...";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}?action=createInvoice&chatId=${userId}`);
                const data = await response.json();

                if (data.ok && data.invoiceLink) {
                    tg.openInvoice(data.invoiceLink, function(status) {
                        if (status === 'paid') {
                            tg.showAlert("გილოცავთ! Premium გააქტიურდა.");
                            location.reload();
                        } else {
                            tg.showAlert("გადახდა ვერ მოხერხდა ან გაუქმდა.");
                        }
                        btn.innerText = originalText;
                        btn.disabled = false;
                    });
                } else {
                    tg.showAlert("შეცდომა ინვოისის შექმნისას.");
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                tg.showAlert("სერვერთან კავშირი ვერ დამყარდა.");
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // UI-ს განახლების დამხმარე ფუნქცია (გამოიძახეთ script.js-დან)
        function updatePremiumUI(tier) {
            const card = document.getElementById('premium-upgrade-card');
            if (card) {
                if (tier === 'Free' || tier === 'FREE') {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            }
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
